[package]
name = "random-wallpaper"
version = "0.1.0"
edition = "2021"
description = "Random Wallpaper for Windows"
authors = ["LM-Firefly"]
license = "GPL-3.0"

[lib]
name = "random_wallpaper_lib"
# Desktop-only build: drop `cdylib` (mobile-only).
# PE export table is capped at 65535 symbols; the GNU toolchain re-exports
# every pub symbol from every rlib into the cdylib, blowing past that limit.
# `lib` (rlib) is enough for main.rs to link against.
crate-type = ["lib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "System_UserProfile",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
