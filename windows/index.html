<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Random Wallpaper</title>
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <div id="app">
            <header class="tabs">
                <button class="tab active" data-tab="general">General</button>
                <button class="tab" data-tab="sources">Wallpaper Sources</button>
                <button class="tab" data-tab="history">History</button>
            </header>
            <main>
                <section id="tab-general" class="panel active"></section>
                <section id="tab-sources" class="panel"></section>
                <section id="tab-history" class="panel"></section>
            </main>
            <div id="status-bar"></div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
